[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "own-api"
version = "1.0.0"
description = "OwnAPI — Enterprise User-Delegated Browser Middleware, Auto-Validated API Compiler, and MCP Engine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ali"}
]
keywords = ["own-api", "user-delegated", "browser-middleware", "plaid-style", "playwright", "mcp", "fastmcp"]
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
ownapi = "ownapi.cli:main"
own-api = "ownapi.cli:main"
shadow-api = "ownapi.cli:main"

[tool.setuptools]
py-modules = ["cli", "healer", "compiler", "recorder", "master_mcp", "agent_demo", "server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ownapi*", "own_api*", "shadow_api*", "registry*"]
